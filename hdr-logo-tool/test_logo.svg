<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#000000"/>
  <!-- pure white glowing circle -->
  <circle cx="150" cy="150" r="90" fill="#ffffff"/>
  <!-- colored elements that should stay SDR -->
  <rect x="280" y="80" width="140" height="140" fill="#ff3b30"/>
  <rect x="440" y="80" width="140" height="140" fill="#34c759"/>
  <!-- soft off-white text-like shape for feathered edge test -->
  <ellipse cx="150" cy="150" rx="110" ry="110" fill="#ffffff" fill-opacity="0.15"/>
</svg>
